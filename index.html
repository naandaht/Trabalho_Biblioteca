<!-- ===================== livros.html ===================== -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Biblioteca - Livros</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f5f2eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25);
      padding: 28px 30px 36px;
    }

    /* cabeçalho / navegação */
    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #eae3d9;
      padding-bottom: 18px;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #3b2c1e;
      letter-spacing: -0.5px;
    }
    .logo span {
      background: #c9b8a4;
      padding: 0 10px;
      border-radius: 30px;
      color: #2d241a;
      font-size: 1rem;
      font-weight: 500;
      margin-left: 6px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #d6cdc0;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 500;
      color: #3b2c1e;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .nav-btn:hover {
      background: #eae3d9;
      border-color: #b7a694;
    }
    .nav-btn.active {
      background: #3b2c1e;
      border-color: #3b2c1e;
      color: white;
    }

    /* livros */
    .livros-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px 20px;
      margin-top: 10px;
    }

    .livro-card {
      background: #fcf9f5;
      border-radius: 24px;
      padding: 18px 14px 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.03);
      border: 1px solid #ede7df;
      transition: 0.1s;
    }
    .livro-card:hover {
      border-color: #c9b8a4;
      background: #fffcf8;
    }
    .livro-titulo {
      font-weight: 600;
      font-size: 1.2rem;
      color: #2d241a;
    }
    .livro-autor {
      color: #5f4d3a;
      font-size: 0.95rem;
      margin: 6px 0 10px;
    }
    .livro-ano {
      background: #eae3d9;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #3b2c1e;
    }

    .info-badge {
      background: #f1ede7;
      padding: 16px 20px;
      border-radius: 60px;
      margin: 20px 0 4px;
      font-size: 0.95rem;
      color: #3b2c1e;
      display: inline-block;
    }

    @media (max-width: 600px) {
      .app-container { padding: 18px; }
      .nav-bar { flex-direction: column; align-items: stretch; }
      .nav-links { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <div class="nav-bar">
    <div class="logo">
      <h1>📖 Biblio<span>virtual</span></h1>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn active">📚 Livros</a>
      <a href="cadastro.html" class="nav-btn">✍️ Cadastro</a>
      <a href="sobre.html" class="nav-btn">ℹ️ Sobre</a>
    </div>
  </div>

  <h2 style="font-weight: 500; color: #2d241a; margin-bottom: 6px;">Acervo disponível</h2>
  <p style="color: #5f4d3a; margin-bottom: 18px;">Livros cadastrados (estáticos)</p>

  <div class="livros-grid" id="livrosContainer">
    <!-- os livros serão inseridos via JavaScript -->
  </div>
  <div class="info-badge">
    ⚡ Total: <span id="totalLivros">0</span> títulos
  </div>

</div>

<script>
  (function() {
    'use strict';

    const livrosData = [
      { titulo: 'Dom Casmurro', autor: 'Machado de Assis', ano: 1899, genero: 'Romance' },
      { titulo: '1984', autor: 'George Orwell', ano: 1949, genero: 'Distopia' },
      { titulo: 'O Senhor dos Anéis', autor: 'J.R.R. Tolkien', ano: 1954, genero: 'Fantasia' },
      { titulo: 'Harry Potter e a Pedra Filosofal', autor: 'J.K. Rowling', ano: 1997, genero: 'Fantasia' },
      { titulo: 'O Pequeno Príncipe', autor: 'Antoine de Saint-Exupéry', ano: 1943, genero: 'Fábula' },
    ];

    const container = document.getElementById('livrosContainer');
    const totalSpan = document.getElementById('totalLivros');

    function renderLivros() {
      if (!container) return;
      container.innerHTML = '';
      livrosData.forEach(livro => {
        const card = document.createElement('div');
        card.className = 'livro-card';
        card.innerHTML = `
          <div class="livro-titulo">${livro.titulo}</div>
          <div class="livro-autor">✍️ ${livro.autor}</div>
          <span class="livro-ano">${livro.ano || 's/d'}</span>
          ${livro.genero ? ` <span style="margin-left: 8px; font-size:0.8rem; color:#6b5d4d;">${livro.genero}</span>` : ''}
        `;
        container.appendChild(card);
      });
      if (totalSpan) totalSpan.textContent = livrosData.length;
    }

    renderLivros();
    console.log('📚 Página de livros carregada');
  })();
</script>
</body>
</html>git
